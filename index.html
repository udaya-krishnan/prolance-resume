    <!-- 3. FAQPage schema (boosts FAQ rich results in Google) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the starting price for a Prolance Resume?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our Starter package begins at ₹899. Standard packages start at ₹1,299. Premium packages are at ₹1,499 (saving 25% vs the individual price of ₹2,000)."

        },

          "@type": "Question",
          "name": "How quickly will I receive my resume?",

            "@type": "Answer",
            "text": "Standard orders are delivered within 24–48 hours of receiving your career details. Priority same-day delivery is available for an additional charge of ₹300."
          }
        },
        {
          "@type": "Question",
          "name": "What does ATS-friendly mean and why does it matter?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ATS stands for Applicant Tracking System — software used by over 75% of Indian and global employers to automatically filter resumes before a human reads them. An ATS-friendly resume is formatted and keyworded to pass this automated screening. Every Prolance Resume is tested to achieve a minimum ATS score of 80+."
          }
        },
        {
          "@type": "Question",
          "name": "Do you write resumes for international job markets?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. We specialise in country-specific resume formats for the UK, USA, Canada, Australia, New Zealand, UAE, Saudi Arabia, Qatar, Kuwait, Bahrain, and all European markets. Each international resume follows the formatting conventions and keyword norms of the target country. International resumes start at ₹1,699."
          }
        },
        {
          "@type": "Question",
          "name": "What does the 30 Days Editing Support cover?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "For 30 days after delivery, you can request free edits to your resume — update a job title, add a new certification, tweak your skills section, or restructure any section. Simply message your assigned writer on WhatsApp and we will make the changes at no additional cost."
          }
        },
        {
          "@type": "Question",
          "name": "What is the LinkedIn Profile Optimisation service?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Our LinkedIn Profile Optimisation service is a complete profile makeover — covering your headline, about section, experience rewrites, skills section (top 50 for your role), SEO keyword audit, banner guidance, and recommendations strategy. Available standalone at ₹1,999 or as an add-on to any resume package with up to 30% discount."
          }
        },
        {
          "@type": "Question",
          "name": "What if I am not happy with my resume?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We offer unlimited revisions until you are completely satisfied at no additional cost. Your assigned writer stays with you throughout the process and will work closely with you via WhatsApp to get the resume exactly where you want it."
          }
        },
        {
          "@type": "Question",
          "name": "Can freshers and recent graduates use Prolance Resume?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes — and we highly recommend it. Our Starter package at ₹899 is specifically designed for students and recent graduates who want a resume that stands out through skills, projects, certifications, and academic achievements."
          }
        }
      ]
    }
